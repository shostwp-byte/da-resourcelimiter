name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & Lint (Go + Shell + PHP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Check LF line endings on scripts and configs
        run: |
          if grep -rnU $'\r' scripts/ plugin/ systemd/ Makefile 2>/dev/null; then
            echo "Error: CRLF line endings detected in Linux scripts/configs!"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests with race detector
        run: go test -v -race ./...

      - name: Cross-compile static Linux binaries (amd64 & arm64)
        run: |
          make build-linux-amd64
          make build-linux-arm64
          ls -lh dist/
          file dist/da-resourced-linux-amd64
          file dist/da-resourced-linux-arm64

      - name: Lint shell & CGI wrapper scripts (ShellCheck)
        run: |
          shopt -s globstar nullglob
          shellcheck scripts/**/*.sh plugin/admin/api.raw plugin/user/stats.raw plugin/admin/index.html plugin/user/index.html

      - name: Lint PHP endpoints
        run: |
          php -l plugin/admin/api.php
          php -l plugin/user/stats.php
