name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Verify Tag, Test, Build & Sign Release Assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify tag is reachable from origin/main & matches version metadata
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Error: tag ${TAG} is not an ancestor of origin/main! Refusing release."
            exit 1
          fi
          PLUGIN_VER="v$(awk -F= '/^version=/{print $2}' plugin/plugin.conf | tr -d '[:space:]')"
          GO_VER="$(sed -n 's/.*Version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' internal/version/version.go | head -n 1)"
          if [[ "$TAG" != "$PLUGIN_VER" || "$TAG" != "$GO_VER" ]]; then
            echo "Error: tag ($TAG) must match plugin.conf ($PLUGIN_VER) and version.go ($GO_VER)."
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 'stable'
          cache: false

      - name: Run formatting, static analysis & race unit test suite
        run: |
          set -euo pipefail
          if grep -rnU $'\r' scripts/ plugin/ systemd/ Makefile .github/workflows/ 2>/dev/null; then
            echo "Error: CRLF line endings detected!"
            exit 1
          fi
          INSTALL_PUB="$(sed -n 's/^PINNED_ED25519_PUBKEY_HEX="\([^"]*\)".*/\1/p' scripts/install.sh | head -n 1)"
          GO_PUB="$(sed -n 's/.*DefaultReleasePublicKeyHex[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' internal/version/version.go | head -n 1)"
          if [[ -z "$INSTALL_PUB" || "$INSTALL_PUB" != "$GO_PUB" ]]; then
            echo "Error: Ed25519 public key mismatch between scripts/install.sh and internal/version/version.go!"
            exit 1
          fi
          test -z "$(gofmt -l .)"
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
          go test -v -race ./...
          shopt -s globstar nullglob
          shellcheck scripts/**/*.sh plugin/admin/api.raw plugin/user/stats.raw plugin/admin/index.html plugin/user/index.html
          php -l plugin/admin/api.php
          php -l plugin/user/stats.php

      - name: Build multi-arch release archives, SHA-256 checksums & Ed25519 signature
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          CLEAN_VER="${TAG#v}"

          mkdir -p release_out

          for ARCH in amd64 arm64; do
            STAGE="release_stage_${ARCH}/da-resource-limiter"
            rm -rf "release_stage_${ARCH}"
            mkdir -p "${STAGE}/bin"

            GOOS=linux GOARCH="${ARCH}" CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X 'github.com/shostwp-byte/da-resourcelimiter/internal/version.Version=${TAG}' -X 'github.com/shostwp-byte/da-resourcelimiter/internal/version.Commit=${COMMIT}' -X 'github.com/shostwp-byte/da-resourcelimiter/internal/version.BuildTime=${BUILD_TIME}'" \
              -o "${STAGE}/bin/da-resourced" ./cmd/da-resourced

            chmod 0755 "${STAGE}/bin/da-resourced"
            cp -a plugin "${STAGE}/plugin"
            cp -a scripts "${STAGE}/scripts"
            cp -a systemd "${STAGE}/systemd"
            CLEAN_VER="$CLEAN_VER" awk '
              /^version=/ { print "version=" ENVIRON["CLEAN_VER"]; next }
              { print }
            ' "${STAGE}/plugin/plugin.conf" > "${STAGE}/plugin/plugin.conf.tmp"
            mv -f "${STAGE}/plugin/plugin.conf.tmp" "${STAGE}/plugin/plugin.conf"

            chmod 0755 \
              "${STAGE}/plugin/admin/index.html" \
              "${STAGE}/plugin/admin/api.raw" \
              "${STAGE}/plugin/user/index.html" \
              "${STAGE}/plugin/user/stats.raw" \
              "${STAGE}/scripts"/*.sh \
              "${STAGE}/scripts/da_hooks"/*.sh

            printf '{\n  "version": "%s",\n  "commit": "%s",\n  "built_at": "%s",\n  "arch": "%s",\n  "min_mariadb": "10.5",\n  "config_schema_version": 1\n}\n' \
              "${TAG}" "${COMMIT}" "${BUILD_TIME}" "${ARCH}" > "${STAGE}/manifest.json"

            tar -czf "release_out/da-resource-limiter-linux-${ARCH}.tar.gz" -C "release_stage_${ARCH}" da-resource-limiter
          done

          cp "release_stage_amd64/da-resource-limiter/manifest.json" release_out/manifest.json
          (
            cd release_out
            sha256sum da-resource-limiter-linux-amd64.tar.gz da-resource-limiter-linux-arm64.tar.gz manifest.json > checksums.txt
          )
          cat release_out/checksums.txt

          if [[ -z "${RELEASE_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "::error::Secret RELEASE_SIGNING_PRIVATE_KEY is required for Ed25519 release signing (N1). Refusing unsigned release."
            exit 1
          fi
          ./release_stage_amd64/da-resource-limiter/bin/da-resourced sign release_out/checksums.txt
          test -s release_out/checksums.txt.sig
          ./release_stage_amd64/da-resource-limiter/bin/da-resourced verify release_out/checksums.txt release_out/checksums.txt.sig

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: release_out/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release_out

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -lh release_out
          ASSETS=(
            release_out/da-resource-limiter-linux-amd64.tar.gz
            release_out/da-resource-limiter-linux-arm64.tar.gz
            release_out/manifest.json
            release_out/checksums.txt
            release_out/checksums.txt.sig
          )
          for asset in "${ASSETS[@]}"; do
            if [[ ! -s "$asset" ]]; then
              echo "::error::Required release asset is missing or empty: $asset"
              exit 1
            fi
          done
          ARGS=(
            "$TAG"
            "${ASSETS[@]}"
            --repo "${GITHUB_REPOSITORY}"
            --verify-tag
            --title "DA-ResourceLimiter ${TAG}"
            --generate-notes
          )
          if [[ "$TAG" == *"-"* ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "${ARGS[@]}"
